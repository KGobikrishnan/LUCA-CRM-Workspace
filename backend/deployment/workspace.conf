server {
    listen 80;
    server_name workspace.example.com; # Replace with actual domain/subdomain

    access_log /var/log/nginx/workspace-backend-access.log;
    error_log /var/log/nginx/workspace-backend-error.log;

    location / {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
